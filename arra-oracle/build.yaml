# Base image per architecture, for the official Home Assistant builder.
# Same 3.22 tags the Dockerfile's pinned digest resolves from — see
# arra-memory-haos/arra-memory/build.yaml for why these must match.
build_from:
  amd64: ghcr.io/home-assistant/amd64-base:3.22
  aarch64: ghcr.io/home-assistant/aarch64-base:3.22

# No `args:` block, deliberately — BUILD_ARCH/BUILD_FROM/BUILD_VERSION come
# from the builder itself. Templating {arch} here overrides the real value
# with the literal string "{arch}" instead.

labels:
  org.opencontainers.image.source: https://github.com/Soul-Brews-Studio/arra-oracle-v3-haos
  org.opencontainers.image.licenses: BUSL-1.1
