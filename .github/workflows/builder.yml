name: Publish add-on images

# Same reasoning as arra-memory-haos: a published image makes an install a
# pull instead of a 90MB-bun-plus-83k-LOC compile on someone's HAOS host, and
# a broken build a red X here rather than "update succeeded, old version
# still running" on their machine.

on:
  push:
    branches: [main]
    paths:
      - "arra-oracle/**"
      - "V3_REF"
      - ".github/workflows/builder.yml"
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, aarch64]

    steps:
      - uses: actions/checkout@v4

      - name: Read the add-on version and app pin
        id: version
        run: |
          version=$(sed -n 's/^version: *"\(.*\)"/\1/p' arra-oracle/config.yaml)
          if [ -z "$version" ]; then
            echo "::error file=arra-oracle/config.yaml::no version: line found"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "Building $version for ${{ matrix.arch }}, app pinned at $(cat V3_REF)"

      # Fetches the pinned arra-oracle-v3 commit into arra-oracle/vendor/ —
      # the Docker build context's copy of app source. The app repo stays
      # pure; this repo owns the pin. See arra-oracle/fetch-vendor.sh.
      - name: Vendor arra-oracle-v3 @ V3_REF
        run: ./arra-oracle/fetch-vendor.sh

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: home-assistant/builder@master
        with:
          args: |
            --${{ matrix.arch }} \
            --target arra-oracle \
            --image {arch}-addon-arra_oracle \
            --docker-hub ghcr.io/${{ steps.version.outputs.owner }} \
            --addon

      # A published tag Supervisor can't pull breaks the installed add-on
      # rather than the install — verify anonymously before this ever ships,
      # per docs/arra-v3-addon-plan.md §1.
      - name: Verify anonymous pull
        run: |
          docker logout ghcr.io
          docker pull "ghcr.io/${{ steps.version.outputs.owner }}/${{ matrix.arch }}-addon-arra_oracle:${{ steps.version.outputs.value }}"
